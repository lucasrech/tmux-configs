<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="sm-ll" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#585b70" stop-opacity="0"/>
      <stop offset="100%" stop-color="#585b70" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="sm-rl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#585b70" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#585b70" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── LINES ── (gap for diamond: x=387 to x=413) -->
  <line x1="0"   y1="20" x2="387" y2="20" stroke="url(#sm-ll)" stroke-width="0.5"/>
  <line x1="413" y1="20" x2="800" y2="20" stroke="url(#sm-rl)" stroke-width="0.5"/>

  <!-- ── CENTRAL DIAMOND ── -->
  <!-- Tips: top=(400,11), right=(409,20), bottom=(400,29), left=(391,20) -->
  <path d="M 400,11 L 409,20 L 400,29 L 391,20 Z"
        stroke="#b4befe" stroke-width="1" fill="none"/>
  <!-- Center dot -->
  <circle cx="400" cy="20" r="2.5" fill="#89dceb" fill-opacity="0.85"/>
  <circle cx="400" cy="20" r="1"   fill="#1e1e2e"/>

  <!-- ── ACCENT DOTS ── -->
  <circle cx="372" cy="20" r="1.3" fill="#b4befe" fill-opacity="0.5"/>
  <circle cx="360" cy="20" r="0.9" fill="#585b70" fill-opacity="0.45"/>
  <circle cx="428" cy="20" r="1.3" fill="#b4befe" fill-opacity="0.5"/>
  <circle cx="440" cy="20" r="0.9" fill="#585b70" fill-opacity="0.45"/>
</svg>
