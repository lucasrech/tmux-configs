# ============================================================
# TMUX CONFIG
# ~/.config/tmux/tmux.conf
# ============================================================


# ============================================================
# TERMINAL / CORES
# ============================================================

set -g default-terminal "tmux-256color"

set-option -sa terminal-features ",xterm*:RGB"

set -g focus-events on

set -g terminal-overrides ',xterm*:Tc'


# ============================================================
# GERAL
# ============================================================

# Mouse
set -g mouse on

# Histórico
set -g history-limit 100000

# Janelas começam em 1
set -g base-index 1

# Panes começam em 1
setw -g pane-base-index 1

# Renumera janelas automaticamente
set -g renumber-windows on

# Reduz atraso do ESC
set -sg escape-time 10

# Sem bell
set -g bell-action none

# Atualiza título do terminal
set -g set-titles on

set -g set-titles-string "#S:#I.#P #W"


# ============================================================
# PREFIX
# ============================================================

# Prefix padrão
set -g prefix C-b


# ============================================================
# NOVAS JANELAS / PANES
# ============================================================

# Nova janela no diretório atual
bind c new-window -c "#{pane_current_path}"

# Split vertical
bind '"' split-window -v -c "#{pane_current_path}"

# Split horizontal
bind % split-window -h -c "#{pane_current_path}"

# Alternativos
bind | split-window -h -c "#{pane_current_path}"

bind - split-window -v -c "#{pane_current_path}"


# ============================================================
# NAVEGAÇÃO
# ============================================================

bind -r h select-pane -L

bind -r j select-pane -D

bind -r k select-pane -U

bind -r l select-pane -R


# ============================================================
# REDIMENSIONAR PANES
# ============================================================

bind -r H resize-pane -L 5

bind -r J resize-pane -D 5

bind -r K resize-pane -U 5

bind -r L resize-pane -R 5


# ============================================================
# COPY MODE
# ============================================================

setw -g mode-keys vi


# ============================================================
# RELOAD
# ============================================================

bind r source-file ~/.config/tmux/tmux.conf \; \
    display-message "tmux.conf recarregado"


# ============================================================
# CORES
# ============================================================

# Nord-like
#
# Fundo        #2e3440
# Fundo 2      #3b4252
# Cinza        #4c566a
# Azul         #5e81ac
# Azul claro   #81a1c1
# Cyan         #88c0d0
# Texto        #d8dee9
# Branco       #eceff4
# Vermelho     #bf616a
# Verde        #a3be8c
# Amarelo      #ebcb8b


# ============================================================
# PANES
# ============================================================

set -g pane-border-style \
    "fg=#4c566a"

set -g pane-active-border-style \
    "fg=#88c0d0"


# Título no topo dos panes
set -g pane-border-status top


# ------------------------------------------------------------
# Pane:
#
# Pane 1 | /home/user/projeto
#
# Container:
#
# Pane 2 | /home/user/projeto | Docker: container
# ------------------------------------------------------------

set -g pane-border-status top

set -g pane-border-format \
" #[fg=#88c0d0,bold]Pane #{pane_index}#[default] \
#[fg=#4c566a]| \
#[fg=#d8dee9]#{pane_current_path} \
#[fg=#5e81ac,bold]#(~/.config/tmux/scripts/pane-context.sh '#{pane_tty}') "

# ============================================================
# STATUS BAR
# ============================================================

set -g status on
set -g status-position bottom
set -g status-interval 2

# Duas linhas
set -g status 2

set -g status-style "bg=#2e3440,fg=#d8dee9"


# ============================================================
# LINHA 1
#
# PREFIX | sessão | janelas                         hostname
#
# PREFIX aparece SOMENTE depois de Ctrl+B.
# ============================================================

set -g status-format[0] \
"#[bg=#2e3440,fg=#d8dee9]\
#{?client_prefix,#[reverse] PREFIX #[default] ,}\
#[bg=#5e81ac,fg=#eceff4,bold] #S #[default] \
#[fg=#d8dee9]| \
#{W:#[fg=#d8dee9]#I:#W ,#[bg=#81a1c1,fg=#2e3440,bold] #I:#W #[default]}\
#[align=right]#[fg=#88c0d0,bold]#H"


# ============================================================
# LINHA 2
#
# NET | VPN | RAM | LOAD                         DATA HORA
# ============================================================

set -g status-format[1] \
"#[bg=#2e3440,fg=#d8dee9]\
#[fg=#88c0d0,bold]NET #[fg=#d8dee9]#(nmcli -t -f DEVICE,TYPE,STATE device status 2>/dev/null | awk -F: '$3==\"connected\" && $2!=\"loopback\" && $2!=\"tun\" && $2!=\"wireguard\" {if(x)x=x\",\";x=x $1} END{print x ? x : \"OFF\"}') \
#[fg=#4c566a]| \
#[fg=#88c0d0,bold]VPN #[fg=#d8dee9]#(nmcli -t -f NAME,TYPE connection show --active 2>/dev/null | awk -F: '$2==\"vpn\" || $2==\"wireguard\" {if(x)x=x\",\";x=x $1} END{print x ? x : \"OFF\"}') \
#[fg=#4c566a]| \
#[fg=#88c0d0,bold]RAM #[fg=#d8dee9]#(free -h | awk '/Mem:/ {print $3 \"/\" $2}') \
#[fg=#4c566a]| \
#[fg=#88c0d0,bold]LOAD #[fg=#d8dee9]#(cut -d' ' -f1 /proc/loadavg) \
#[align=right]\
#[fg=#81a1c1]%d/%m/%Y \
#[fg=#88c0d0,bold]%H:%M "


# ============================================================
# JANELAS
# ============================================================

setw -g window-status-style \
    "fg=#d8dee9,bg=#2e3440"

setw -g window-status-current-style \
    "fg=#2e3440,bg=#81a1c1,bold"

setw -g window-status-separator ""


# ============================================================
# MENSAGENS
# ============================================================

set -g message-style \
    "bg=#5e81ac,fg=#eceff4,bold"

set -g message-command-style \
    "bg=#5e81ac,fg=#eceff4,bold"


# ============================================================
# COPY / SELECTION
# ============================================================

setw -g mode-style \
    "bg=#5e81ac,fg=#eceff4,bold"


# ============================================================
# CLOCK
# ============================================================

setw -g clock-mode-colour "#88c0d0"