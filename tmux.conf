# ============================================================
# TMUX CONFIG
# ~/.config/tmux/tmux.conf
# ============================================================


# ============================================================
# TERMINAL / CORES
# ============================================================

set -g default-terminal "tmux-256color"

set-option -sa terminal-features ",xterm*:RGB"

set -g focus-events on

set -g terminal-overrides ',xterm*:Tc'


# ============================================================
# GERAL
# ============================================================

# Mouse
set -g mouse on

# Histórico
set -g history-limit 100000

# Janelas começam em 1
set -g base-index 1

# Panes começam em 1
setw -g pane-base-index 1

# Renumera janelas automaticamente
set -g renumber-windows on

# Reduz atraso do ESC
set -sg escape-time 10

# Sem bell
set -g bell-action none

# Atualiza título do terminal
set -g set-titles on

set -g set-titles-string "#S:#I.#P #W"


# ============================================================
# PREFIX
# ============================================================

# Prefix padrão
set -g prefix C-b


# ============================================================
# NOVAS JANELAS / PANES
# ============================================================

# Nova janela no diretório atual
bind c new-window -c "#{pane_current_path}"

# Split vertical
bind '"' split-window -v -c "#{pane_current_path}"

# Split horizontal
bind % split-window -h -c "#{pane_current_path}"

# Alternativos
bind | split-window -h -c "#{pane_current_path}"

bind - split-window -v -c "#{pane_current_path}"


# ============================================================
# NAVEGAÇÃO
# ============================================================

bind -r h select-pane -L

bind -r j select-pane -D

bind -r k select-pane -U

bind -r l select-pane -R


# ============================================================
# REDIMENSIONAR PANES
# ============================================================

bind -r H resize-pane -L 5

bind -r J resize-pane -D 5

bind -r K resize-pane -U 5

bind -r L resize-pane -R 5


# ============================================================
# COPY MODE
# ============================================================

setw -g mode-keys vi


# ============================================================
# RELOAD
# ============================================================

bind r source-file ~/.config/tmux/tmux.conf \; \
    display-message "tmux.conf recarregado"


# ============================================================
# CORES
# ============================================================

# Pastel sobre fundo escuro
#
# Fundo        #1e1e2e
# Fundo 2      #313244
# Cinza        #585b70
# Texto        #cdd6f4
# Texto 2      #bac2de
# Lavanda      #b4befe
# Azul         #89b4fa
# Cyan         #89dceb
# Verde        #a6e3a1
# Amarelo      #f9e2af
# Pêssego      #fab387
# Rosa         #f5c2e7
# Vermelho     #f38ba8


# ============================================================
# PANES
# ============================================================

set -g pane-border-style \
    "fg=#585b70"

set -g pane-active-border-style \
    "fg=#b4befe"


# Título no topo dos panes
set -g pane-border-status top


# ------------------------------------------------------------
# Pane:
#
# Pane 1 | /home/user/projeto
#
# Container:
#
# Pane 2 | /home/user/projeto | Docker: container
# ------------------------------------------------------------

set -g pane-border-status top

set -g pane-border-format \
" #[fg=#b4befe,bold]Pane #{pane_index}#[default] \
#[fg=#585b70]| \
#[fg=#cdd6f4]#{pane_current_path} \
#[fg=#89dceb,bold]#(~/.config/tmux/scripts/pane-context.sh '#{pane_tty}') "

# ============================================================
# STATUS BAR
# ============================================================

set -g status on
set -g status-position bottom
set -g status-interval 1

# Duas linhas
set -g status 2

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"


# ============================================================
# LINHA 1
#
# PREFIX | sessão | janelas                         hostname
#
# PREFIX aparece SOMENTE depois de Ctrl+B.
# ============================================================

set -g status-format[0] \
"#[bg=#2e3440]#[fg=#d8dee9]\
#{?client_prefix,#[reverse] PREFIX #[default],}\
#[bg=#5e81ac]#[fg=#eceff4]#[bold] #S #[default] \
#[fg=#d8dee9]| \
#{W:#I:#W ,#I:#W }\
#[align=right]#[fg=#88c0d0]#[bold]#H"

# ============================================================
# LINHA 2
#
# NET | VPN | RAM | LOAD | Spotify                 DATA HORA
#
# O segmento Spotify é sempre visível (playing/paused/idle/offline).
# Fonte: MPRIS via playerctl — independente do pane spotatui.
# status-interval 1 → marquee avança 1 char/segundo.
# ============================================================

set -g status-format[1] \
"#[bg=#1e1e2e,fg=#cdd6f4]\
#[fg=#89dceb,bold]NET #[fg=#cdd6f4]#(nmcli -t -f DEVICE,TYPE,STATE device status 2>/dev/null | awk -F: '$3==\"connected\" && $2!=\"loopback\" && $2!=\"tun\" && $2!=\"wireguard\" {if(x)x=x\",\";x=x $1} END{print x ? x : \"OFF\"}') \
#[fg=#585b70]| \
#[fg=#a6e3a1,bold]VPN #[fg=#cdd6f4]#(nmcli -t -f NAME,TYPE connection show --active 2>/dev/null | awk -F: '$2==\"vpn\" || $2==\"wireguard\" {if(x)x=x\",\";x=x $1} END{print x ? x : \"OFF\"}') \
#[fg=#585b70]| \
#[fg=#f9e2af,bold]RAM #[fg=#cdd6f4]#(free -h | awk '/Mem:/ {print $3 \"/\" $2}') \
#[fg=#585b70]| \
#[fg=#fab387,bold]LOAD #[fg=#cdd6f4]#(cut -d' ' -f1 /proc/loadavg) \
#[fg=#585b70]| \
#(~/.config/tmux/scripts/status-spotify.sh #{client_width})\
#[align=right]\
#[fg=#f5c2e7]%d/%m/%Y \
#[fg=#89dceb,bold]%H:%M "


# ============================================================
# JANELAS
# ============================================================

setw -g window-status-style \
    "fg=#bac2de,bg=#1e1e2e"

setw -g window-status-current-style \
    "fg=#1e1e2e,bg=#89b4fa,bold"

setw -g window-status-separator ""


# ============================================================
# MENSAGENS
# ============================================================

set -g message-style \
    "bg=#313244,fg=#f9e2af,bold"

set -g message-command-style \
    "bg=#313244,fg=#89dceb,bold"


# ============================================================
# COPY / SELECTION
# ============================================================

setw -g mode-style \
    "bg=#b4befe,fg=#1e1e2e,bold"


# ============================================================
# CLOCK
# ============================================================

setw -g clock-mode-colour "#89dceb"


# ============================================================
# SPOTIFY
# ============================================================

# Prefix + s → abre pane lateral do Spotify (singleton)
# Usa split-window para não bloquear a window (display-popup é modal)
# O script verifica se o pane já existe antes de criar outro
bind s run-shell "~/.config/tmux/scripts/spotify-launch.sh"

# Controles de mídia via MPRIS/playerctl (sudo apt install playerctl)
# B = Back (faixa anterior)   P = Play/Pause   N = Next (próxima)
# Maiúsculos: distintos de n=next-window, p=previous-window
bind B run-shell "playerctl -p spotatui previous   2>/dev/null || true"
bind P run-shell "playerctl -p spotatui play-pause 2>/dev/null || true"
bind N run-shell "playerctl -p spotatui next       2>/dev/null || true"
